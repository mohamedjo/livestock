spring.datasource.url=jdbc:h2:mem:livestock_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# avoid trying to connect to a real broker during contextLoads
spring.kafka.bootstrap-servers=localhost:0
spring.kafka.consumer.group-id=livestock-test

livestock.kafka.topics.animal-created=livestock.animal.created
livestock.kafka.topics.animal-fed=livestock.animal.fed
livestock.kafka.topics.animal-vaccinated=livestock.animal.vaccinated
livestock.kafka.topics.farm-deleted=farm.farm.deleted

livestock.farm-service.base-url=http://localhost:8081
livestock.farm-service.service-token=

management.tracing.enabled=false
management.endpoints.web.exposure.include=health
management.prometheus.metrics.export.enabled=false
management.health.circuitbreakers.enabled=false

resilience4j.circuitbreaker.instances.farmService.minimum-number-of-calls=1000
resilience4j.retry.instances.farmService.max-attempts=1
