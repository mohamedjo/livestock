spring.application.name=livestock

# ---- Database (PostgreSQL) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/livestock?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Kafka ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:livestock-service}
spring.kafka.consumer.auto-offset-reset=earliest

livestock.kafka.topics.animal-created=${KAFKA_TOPIC_ANIMAL_CREATED:livestock.animal.created}
livestock.kafka.topics.animal-moved=${KAFKA_TOPIC_ANIMAL_MOVED:livestock.animal.moved}
livestock.kafka.topics.animal-sold=${KAFKA_TOPIC_ANIMAL_SOLD:livestock.animal.sold}
livestock.kafka.topics.animal-fed=${KAFKA_TOPIC_ANIMAL_FED:livestock.animal.fed}
livestock.kafka.topics.animal-vaccinated=${KAFKA_TOPIC_ANIMAL_VACCINATED:livestock.animal.vaccinated}

# ---- Jackson 3 (Spring Boot 4): date/time features are under datatype.datetime, not serialization
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
