spring.application.name=livestock


spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/livestock}

livestock.security.keycloak.client-id=${KEYCLOAK_CLIENT_ID:livestock-client}

# ---- Database (PostgreSQL) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/livestock?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Kafka ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:livestock-service}
spring.kafka.consumer.auto-offset-reset=earliest

livestock.kafka.topics.animal-created=${KAFKA_TOPIC_ANIMAL_CREATED:livestock.animal.created}

# ---- Outbox dispatcher ----
livestock.outbox.dispatch.batch-size=${LIVESTOCK_OUTBOX_BATCH_SIZE:50}
livestock.outbox.dispatch.fixed-delay-ms=${LIVESTOCK_OUTBOX_FIXED_DELAY_MS:2000}
livestock.kafka.topics.animal-fed=${KAFKA_TOPIC_ANIMAL_FED:livestock.animal.fed}
livestock.kafka.topics.animal-vaccinated=${KAFKA_TOPIC_ANIMAL_VACCINATED:livestock.animal.vaccinated}
livestock.kafka.topics.farm-deleted=${KAFKA_TOPIC_FARM_DELETED:farm.farm.deleted}

# ---- Farm service (cross-service validation) ----
livestock.farm-service.base-url=${FARM_SERVICE_BASE_URL:http://localhost:8081}
livestock.farm-service.service-token=${FARM_SERVICE_TOKEN:}
logging.level.org.apache.kafka=ERROR
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.file.name=${LOG_FILE:logs/livestock.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE_PATTERN:logs/livestock-%d{yyyy-MM-dd}.%i.log.gz}

# ---- Jackson 3 (Spring Boot 4): date/time features are under datatype.datetime, not serialization
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# ---- OpenAPI / Swagger UI (springdoc) ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---- OpenAPI content (no hardcoded strings in code) ----
livestock.openapi.title=Livestock service API
livestock.openapi.version=0.0.1
livestock.openapi.contact-name=Shabic Livestock
livestock.openapi.server-url=http://localhost:8080
livestock.openapi.server-description=Local
livestock.openapi.tag-animals-name=Animals
livestock.openapi.tag-animals-description=Register, update, and query livestock animals
livestock.openapi.example-register-full-name=Full example (Harri sheep)
livestock.openapi.example-register-minimal-name=Minimal
livestock.openapi.example-update-name=Full update
livestock.openapi.response-animal-id-example=990e8400-e29b-41d4-a716-446655440099
livestock.openapi.description=REST API for animals: register, update, and query by farm.\n\nPostman: File -> Import -> Link and paste: http://localhost:8080/v3/api-docs (or import postman/Livestock.postman_collection.json)


eureka.client.service-url.defaultZone=http://localhost:8761/eureka